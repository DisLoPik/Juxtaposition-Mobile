name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    # Must be Apple Silicon. Compose Multiplatform publishes no iosX64 artifacts, so an Intel
    # runner (macos-13) cannot resolve the dependencies at all.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Git on Windows has core.filemode=false, so regenerating the wrapper there commits
      # gradlew without its executable bit and every Gradle step fails with "Permission denied".
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile shared framework
        # Run before xcodebuild so a Kotlin error is reported on its own, rather than buried
        # in the Xcode build log. Gradle caches it, so the Xcode build phase reuses this.
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build app for simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  test:
    name: Shared tests on iOS
    # Kept separate from the app build. A problem with the Kotlin/Native simulator test runner
    # says nothing about whether the app itself compiles, so it must not block shipping one.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: List available simulators
        # The Kotlin/Native test runner needs a simulator device to exist. Printing what the
        # image actually provides makes a "device not found" failure obvious in the log.
        run: xcrun simctl list devices available

      - name: Run shared tests
        # Exercises the HTML parsers and the painting encoder on Kotlin/Native, not just the JVM.
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/
            shared/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  unsigned-ipa:
    name: Unsigned IPA
    # Only worth producing for a release tag or an explicit run. Depends on the app building,
    # deliberately not on the test job.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Archive without signing
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Juxtaposition.xcarchive" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Package as IPA
        # An .ipa is just a zip with the .app inside a Payload directory. Without a signature
        # this cannot be installed directly; it needs re-signing by AltStore, Sideloadly or
        # similar on the target device.
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Juxtaposition.xcarchive/Products/Applications/Juxtaposition.app" \
                "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Juxtaposition-unsigned.ipa Payload
          ls -lh Juxtaposition-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Juxtaposition-unsigned-ipa
          path: ${{ runner.temp }}/Juxtaposition-unsigned.ipa
          retention-days: 30
